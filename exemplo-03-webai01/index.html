<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Chat IA Local</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        background: #111827;
        color: white;
        padding: 15px 20px;
        font-size: 18px;
        font-weight: bold;
      }

      #settings {
        background: #ffffff;
        padding: 10px 20px;
        display: flex;
        gap: 20px;
        align-items: center;
        border-bottom: 1px solid #ddd;
      }

      #settings label {
        font-size: 14px;
      }

      #settings input {
        width: 70px;
        padding: 4px;
        margin-left: 5px;
      }

      #chat {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 18px;
        line-height: 1.4;
        word-wrap: break-word;
      }

      .user {
        align-self: flex-end;
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .assistant {
        align-self: flex-start;
        background: #e5e7eb;
        color: #111;
        border-bottom-left-radius: 4px;
      }

      #controls {
        display: flex;
        padding: 15px;
        background: white;
        border-top: 1px solid #ddd;
        gap: 10px;
      }

      #question {
        flex: 1;
        padding: 10px;
        border-radius: 20px;
        border: 1px solid #ccc;
        outline: none;
      }

      #send {
        padding: 10px 18px;
        border-radius: 20px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
        min-width: 110px;
        transition: 0.2s;
      }

      #send:hover {
        background: #1d4ed8;
      }

      #send:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top: 2px solid white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
        vertical-align: middle;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <header>Chat com IA Local</header>

    <div id="settings">
      <label>
        Temperature:
        <input
          type="number"
          id="temperature"
          step="0.1"
          min="0"
          max="2"
          value="0.7"
        />
      </label>

      <label>
        topK:
        <input type="number" id="topK" min="1" max="100" value="40" />
      </label>

      <span style="font-size: 12px; color: #666">
        (Ao alterar os valores, uma nova sessão será criada)
      </span>
    </div>

    <div id="chat"></div>

    <div id="controls">
      <input id="question" placeholder="Digite sua pergunta..." />
      <button id="send">Enviar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>

    <script>
      const chat = document.getElementById("chat");
      const input = document.getElementById("question");
      const button = document.getElementById("send");
      const tempInput = document.getElementById("temperature");
      const topKInput = document.getElementById("topK");

      let session = null;
      let currentConfig = {};

      function addMessage(text, role) {
        const div = document.createElement("div");
        div.className = "message " + role;
        div.innerHTML = markdown.toHTML(text);
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      function setLoading(isLoading) {
        if (isLoading) {
          button.disabled = true;
          button.dataset.original = button.innerHTML;

          button.innerHTML = `
            <span class="spinner"></span>
            Pensando...
            `;
        } else {
          button.disabled = false;
          button.innerHTML = button.dataset.original || "Enviar";
        }
      }

      async function createSessionIfNeeded() {
        const temperature = parseFloat(tempInput.value);
        const topK = parseInt(topKInput.value);

        const newConfig = { temperature, topK };

        const configChanged =
          !currentConfig.temperature ||
          currentConfig.temperature !== temperature ||
          currentConfig.topK !== topK;

        if (!session || configChanged) {
          currentConfig = newConfig;
          session = null;

          const availability = await LanguageModel.availability();

          if (availability === "unavailable") {
            throw new Error("Modelo não disponível.");
          }

          session = await LanguageModel.create({
            expectedInputLanguages: ["pt"],
            temperature,
            topK,
            initialPrompts: [
              {
                role: "system",
                content:
                  "Você é um assistente claro, objetivo e responde em português.",
              },
            ],
          });
        }
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        addMessage(text, "user");

        try {
          setLoading(true);

          await createSessionIfNeeded();

          const assistantDiv = addMessage("...", "assistant");
          let fullText = "";

          const stream = await session.promptStreaming([
            { role: "user", content: text },
          ]);

          for await (const token of stream) {
            fullText += token;
            assistantDiv.innerHTML = markdown.toHTML(fullText);
            chat.scrollTop = chat.scrollHeight;
          }
        } catch (err) {
          addMessage("Erro: " + err.message, "assistant");
          console.error(err);
        } finally {
          setLoading(false);
        }
      }

      button.addEventListener("click", sendMessage);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !button.disabled) {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
